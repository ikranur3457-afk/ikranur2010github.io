<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   

    <!-- Site Başlığı ve Menü -->
    <header>
        <h1>Kişisel Sitem</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="hakkimda.html">Hakkımda</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <!-- Ana İçerik ve İletişim Formu -->
    <main>
        <section>
            <h2>İletişim Formu</h2>
            <p>Benimle iletişime geçmek için aşağıdaki formu doldurabilirsiniz.</p>

            <!-- Form: action yazılmadı, aynı sayfaya gönderilir[span_4](start_span)[span_4](end_span) -->
            <form>
                <!-- Ad Alanı (required, minlength)[span_5](start_span)[span_5](end_span) -->
                <div>
                    <label for="ad">Adınız:</label><br>
                    <input type="text" id="ad" name="ad" required minlength="3">
                </div>
                <br>

                <!-- E-posta Alanı (type="email", required)[span_6](start_span)[span_6](end_span) -->
                <div>
                    <label for="eposta">E-posta Adresiniz:</label><br>
                    <input type="email" id="eposta" name="eposta" required>
                </div>
                <br>

                <!-- Konu Alanı (select ile en az 3 seçenek)[span_7](start_span)[span_7](end_span) -->
                <div>
                    <label for="konu">Konu Seçin:</label><br>
                    <select id="konu" name="konu">
                        <option value="oneri">Öneri</option>
                        <option value="sikayet">Şikayet</option>
                        <option value="diger">Diğer</option>
                    </select>
                </div>
                <br>

                <!-- HTML5 Ek Input 1: Tarih (date)[span_8](start_span)[span_8](end_span) -->
                <div>
                    <label for="tarih">Görüşme Tarihi:</label><br>
                    <input type="date" id="tarih" name="tarih">
                </div>
                <br>

                <!-- HTML5 Ek Input 2 ve Pattern + Title Kullanımı[span_9](start_span)[span_9](end_span) -->
                <div>
                    <label for="kod">Özel Kod (Örnek: 2 Büyük Harf + 3 Rakam, örn: AB123):</label><br>
                    <input type="text" id="kod" name="kod" pattern="[A-Z]{2}[0-9]{3}" title="Lütfen 2 büyük harf ve 3 rakam girin (Örn: AB123)">
                </div>
                <br>

                <!-- Nasıl Ulaştınız? (Radio butonları)[span_10](start_span)[span_10](end_span) -->
                <div>
                    <label>Bize nasıl ulaştınız?</label><br>
                    <input type="radio" id="sosyal" name="ulasim" value="sosyal">
                    <label for="sosyal">Sosyal Medya</label><br>
                    
                    <input type="radio" id="arama" name="ulasim" value="arama">
                    <label for="arama">Arama Motoru</label>
                </div>
                <br>

                <!-- Mesaj Alanı (textarea, required, maxlength="500")[span_11](start_span)[span_11](end_span) -->
                <div>
                    <label for="mesaj">Mesajınız (En fazla 500 karakter):</label><br>
                    <textarea id="mesaj" name="mesaj" required maxlength="500" rows="4" cols="40"></textarea>
                </div>
                <br>

                <!-- Gönder ve Temizle Düğmeleri[span_12](start_span)[span_12](end_span) -->
                <div>
                    <button type="submit">Gönder</button>
                    <button type="reset">Temizle</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Alt Bilgi -->
    <footer>
        <p>&copy; 2026 - Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
</body>
</html>
